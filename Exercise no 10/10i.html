<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Calculator</title>
</head>
<style>
    #display{
        font-family: Arial, Helvetica, sans-serif;
        color:white;
    }
    button{
        background-color: rgb(25, 25, 25);
        color:white;
        border:none;
        width:30px;
        height:30px;
        border-radius:50%;

    }
    .clear-btn{
         width:60px;
        height:30px;
        border-radius: 1px;

    }
    
    .plus-sign,
    .minus-sign,
    .multi-sign,
    .div-sign{
        background-color: orange;

    }
    body{
        background-color:   black;


    }
    

</style>
<body>


    <p id="display">0</p>

    <p> 
        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button onclick="addValue(' + ')" class="plus-sign">+</button>
    </p>

    <p>
        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button onclick="addValue(' - ')" class="minus-sign">-</button>
    </p>

    <p>
        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button onclick="addValue(' * ')" class="multi-sign">*</button>
    </p>

    <p>
        <button onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="addValue(' / ')" class="div-sign">/</button>
    </p>

    <p>
        <button onclick="clearCalc()" class="clear-btn">Clear</button>
    </p>

    <script>
        let calculation = '';
        const display = document.getElementById('display');

        function addValue(value) {
            calculation += value;
            display.innerText = calculation;
        }

        function calculate() {
            calculation = String(eval(calculation));
            display.innerText = calculation;
        }

        function clearCalc() {
            calculation = '';
            display.innerText = '0';
        }
    </script>

</body>
</html>
