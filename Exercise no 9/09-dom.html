<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph changed</title>
</head>
<body>
    <button onclick="yak()">Press it</button>
    <p id="mypara">This paragraph will be changed</p>

    <script>
        function yak(){
            let para = document.getElementById('mypara');

        if(para.innerHTML === 'This paragraph is now changed'){
            para.innerHTML = 'This paragraph will be changed';
        } else {
            para.innerHTML = 'This paragraph is now changed';

        }

        }
        
    </script>
</body>
</html>
