<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruits">
        <li>apple</li>
        <li>orange</li>
        <li>banana</li>
    </ul>

    <ul id="vegetable">
        <li>carrots</li>
        <li>onions</li>
        <li>potatatoes</li>
    </ul>

    <ul id="dessert">
        <li>cake</li>
        <li>pie</li>
        <li>ice cream</li>
    </ul>

    <script>

        const ulElements = document.querySelectorAll('ul');

        ulElements.forEach(ulEelement => {
            const firstChild = ulEelement.firstElementChild;
            firstChild.style.backgroundColor = 'pink';

        } );

       
        
        




    </script>
</body>
</html>
