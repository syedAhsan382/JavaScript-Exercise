<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .red{
        background-color: red;
        color:white;
        border-radius: 10px;o
        border:none;
    }
    .blue{
        background-color: blue;
        color:white;
        border-radius: 10px;
        border:none;
    }
    .green{
        background-color: green;
        color:white;
        border-radius: 10px;
        border:none;
    
    }
    .yellow{
        background-color: yellow;
        color:white;
        border-radius: 10px;
        border:none;
    }
    .black{
        background-color: black;
        color:white;
        border-radius: 10px;
        border:none;
    }
    
</style>
<body>
    <div class="all-button">
    <button class="red" onclick="changeColor('red')">Red</button>
    <button class="blue" onclick="changeColor('blue')">Blue</button>
    <button class="green" onclick="changeColor('green')">Green</button>
    <button class="yellow" onclick="changeColor('yellow')">Yellow</button>
    <button class="black" onclick="changeColor('black')">black</button>
    </div>
    
    

    <script>
        function changeColor(color){
            document.body.style.backgroundColor = color;

        }
        
    </script>
</body>
</html>
