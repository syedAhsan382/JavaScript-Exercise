<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper Scissors game</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
</style>

<body>

    <p>Rock Paper Sicissors game</p>

    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')">Scissors</button>
    <button onclick="resetScore()">Reset score</button>

     
    <script>
        // Initialize score from localStorage, or create default if it doesn't exist
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        };

        function playGame(playerMove){
            const computerMove = pickComputerMove();

            let result = '';
            // Scissor move logic if statements
            if(playerMove === 'scissors'){
                if(computerMove === 'rock'){
                    result = 'You lose';
                }
                else if(computerMove === 'paper'){
                    result = 'You win';
                }
                else if(computerMove === 'scissors'){
                    result = 'Tie';
                }

            // Paper move logic if statements
            } else if (playerMove === 'paper'){
                if(computerMove === 'rock'){
                    result = 'You win'
                }
                else if(computerMove === 'paper'){
                    result = 'Tie'
                }
                else if(computerMove === 'scissors'){
                    result = 'You lose'
                }

            // rock move logic if statements
            } else if(playerMove === 'rock'){
                if(computerMove === 'rock'){
                    result = 'Tie';
                }
                else if(computerMove === 'paper'){
                    result = 'You lose';
                }
                else if(computerMove === 'scissors'){
                    result = 'You win';
                }
            }

            //Score changing logic
            if(result === 'You win'){
                score.wins += 1; 
            }else if(result === 'You lose'){
                score.losses += 1;
            }else if(result === 'Tie'){
                score.ties += 1;
            }

            localStorage.setItem('score', JSON.stringify(score));

            // Window pop up shows result of the game by using window.alert 
            alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
            Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }
        
        // Computer move logic if-else statements
        function pickComputerMove(){
            const randomNumber = Math.floor(Math.random() * 3)
            let computerMove = '';

            if(randomNumber === 0){
                computerMove = 'rock';
            }
            else if(randomNumber === 1){
                computerMove = 'paper';
            }
            else{
                computerMove = 'scissors';
            }
            return computerMove;
        }

        function resetScore(){
            score.wins = 0;
            score.losses = 0;
            score.ties = 0;
            localStorage.setItem('score', JSON.stringify(score));
            alert('Score has been reset!');
        }

    </script>
</body>
</html>
