<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Less expensive product</title>
</head>
<body>
    <script>
        function comparePrice(product1, product2){
           
            if(product1.price < product2.price){
                return product1;
            }
            else if(product2.price < product1.price){
                return product2;
            }
            else{
                return null;
            }
        }
         const product1 = {
                name : "handBag",
                price : 2000,
            }

            const product2 = {
                name : "pan",
                price : 1500,
            }

        console.log(comparePrice(product1, product2));
    </script>
</body>
</html>
